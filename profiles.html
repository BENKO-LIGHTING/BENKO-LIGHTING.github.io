<style>
:root{--bg:#f2f3f7;--card:#fff;--fg:#151821;--mut:#5d6475;--line:#dfe2ea;--soft:#eceef4;--acc:#151821;--accfg:#fff;--hi:#f29a12;--bar:#141824;
 --spectrum:linear-gradient(90deg,#f29a12,#f6c453 22%,#e8455f 44%,#8b6cf0 66%,#2f7bf0 84%,#0fa596);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e14;--card:#161a24;--fg:#eef0f6;--mut:#9aa2b6;--line:#272c3a;--soft:#1d2230;--acc:#eef0f6;--accfg:#0c0e14;--bar:#080a10;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hd b{font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
input:disabled{opacity:.45}
textarea{min-height:60px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.draw{margin-top:12px;overflow-x:auto;border:1px dashed var(--line);border-radius:8px;padding:4px}
.draw svg{display:block;min-width:560px;width:100%;height:auto}
.tot{font-size:.85rem;color:var(--mut)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:.9rem;margin:0}
.full{grid-column:1/-1}
.qbox{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem}.qbox table{width:100%;border-collapse:collapse}.qbox td{padding:2px 0}.qbox td:last-child{text-align:left;white-space:nowrap}.qbox .t td{font-weight:700;border-top:1px solid var(--line)}.qt{width:100%;border-collapse:collapse;margin:0 0 12px}.qt th,.qt td{padding:4px 6px;border-bottom:1px solid var(--line);font-size:.9rem;text-align:right}.qt th{background:var(--bg)}.qt td:last-child{text-align:left;white-space:nowrap}.qt tr.b td{font-weight:700}.ponly{display:none}.trb{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem}.trb label.trc{flex-direction:row;align-items:center;gap:8px;font-size:.95rem;color:var(--fg);margin-top:6px;font-weight:600}.trb input[type=checkbox]{width:20px;height:20px;padding:0}#pq[hidden]{display:none!important}
@media screen{#pq,#pq tbody,#pq tr,#pq td{display:block}#pq thead{display:none}}
@media print{body.pq #pt{display:none!important}body:not(.pq) #pq{display:none!important}#pq{width:100%}#pq>tbody>tr>td{padding:0}#qcard{border:0;padding:0;margin:0;background:none}#qcard .hd{display:none}.ponly{display:block;font-weight:700;font-size:16px;margin:0 0 6px}}
.lbl{font-size:.8rem;color:var(--mut);margin-bottom:4px}.shapes{display:flex;gap:8px;flex-wrap:wrap}.sh{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 6px;font-size:.8rem}.sh.on{border-color:var(--acc);outline:2px solid var(--acc);background:var(--bg)}
.co{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--acc);padding:4px 0 8px;margin-bottom:10px}.co img{height:46px;width:auto}.co .ct{font-size:.78rem;line-height:1.5;color:var(--mut)}.co .ct b{color:var(--acc);font-size:.95rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
@media screen{#pt,#pt tbody,#pt tr,#pt td{display:block}#pt thead{display:none}}
@page{size:A4;margin:10mm}
@media print{#list,.noprint,.scr{display:none!important}body{background:#fff;color:#000;font-size:12px}main{max-width:none;padding:0}#pt{width:100%}#pt td{padding:0}.logo{filter:none!important}.co .ct{color:#333}#sumcard{border:0;padding:0;margin:0;background:none}#sumcard .hd{display:none}pre{border:0;padding:0;background:none;color:#000;font-size:11.5px;line-height:1.4}#sum:empty{display:none!important}#sum{font-weight:700;font-size:13px;margin:0 0 6px}#sumdraw .draw{break-inside:avoid;border:0;margin-top:6px;padding:0}}

/* --- Benko catalog look --- */
body{font-family:"IBM Plex Sans Hebrew","Rubik",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
main{padding:18px 16px 40px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:#f5f6fa}
.appbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;height:60px;padding:0 16px}
.appbar img{height:28px;width:auto;display:block}
.appbar .ttl{border-inline-start:1px solid #343a4c;padding-inline-start:14px;line-height:1.2}
.appbar .ttl b{display:block;font-family:"Rubik",sans-serif;font-weight:600;font-size:16px}
.appbar .ttl span{font-size:12px;color:#a8afc2}
.appbar .sp{flex:1}
.appbar .back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;background:#232838;border:1px solid #343a4c;border-radius:12px;padding:8px 12px;font-weight:500;font-size:14px}
.appbar .back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.appbar::after{content:"";display:block;height:3px;background:var(--spectrum)}
@media (max-width:560px){.appbar .ttl span{display:none}.appbar img{height:22px}}
.co.scr{display:none}
.phero{margin:6px 0 16px}
.phero h1{font-family:"Rubik",sans-serif;font-weight:700;font-size:clamp(24px,4.6vw,34px);margin:0;line-height:1.15}
.phero p{margin:6px 0 0;color:var(--mut);font-size:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.steps span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.steps i{font-style:normal;font-family:"IBM Plex Mono",monospace;color:var(--hi);margin-left:4px}
.card{border-radius:18px;padding:16px;position:relative;overflow:hidden}
#list .card{padding-top:20px}
#list .card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--spectrum)}
.hd b{font-family:"Rubik",sans-serif;font-size:1.15rem;font-weight:600}
label{font-weight:500;font-size:.8rem}
input,select,textarea{border-radius:10px;padding:9px 10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid #2f7bf0;outline-offset:0;border-color:transparent}
button{border-radius:12px;padding:9px 14px;font-weight:500}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
#add{background:var(--spectrum);border:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.sh{border-radius:14px;min-width:82px;background:var(--card)}
.sh svg{color:var(--fg)}
.sh.on{border-color:var(--hi);outline:2px solid var(--hi);background:color-mix(in srgb,var(--hi) 12%,var(--card))}
.sh.on svg{color:var(--hi)}
.draw{border-radius:14px;border:1px solid var(--line);background:var(--card);direction:ltr}
.qbox{border-radius:12px;background:var(--bg);border-color:var(--line)}
.trb{border-radius:12px;background:var(--bg)}
pre{border-radius:12px}
.tot{color:#0fa596;font-weight:600;margin-top:8px}
.lbl{font-weight:500}
#qcard,#sumcard{border-top:0}
#sumcard .hd b,#qcard .hd b{font-size:1.25rem}
@media print{.appbar,.phero,body::before{display:none!important}.draw svg{min-width:0!important}}

#sum{white-space:normal;background:none;border:0;padding:0;margin:0 0 6px;font:inherit}
.ohd{display:flex;flex-wrap:wrap;gap:8px 30px;padding:12px 16px;border:2px solid var(--fg);border-radius:12px;margin-bottom:14px}
.ohd div{display:flex;flex-direction:column;line-height:1.25}.ohd span{font-size:.8rem;color:var(--mut)}.ohd b{font-size:1.3rem}
.grp{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.ghd{border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:6px}
.gt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gt b{font-size:1.55rem;line-height:1.2}
.gc{font-size:1.1rem;font-weight:700;padding:2px 12px;border-radius:8px;background:var(--fg);color:var(--card)}
.gn{margin-inline-start:auto;font-weight:700;font-size:1.05rem}
.gkv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px 20px;margin:10px 0 0}
.gkv div{display:flex;gap:8px;font-size:1.05rem;align-items:baseline}.gkv dt{color:var(--mut);min-width:70px;font-size:.92rem}.gkv dd{margin:0;font-weight:700}
.draw.gd{display:flex;align-items:center;gap:8px;border-style:solid}
.draw.gd svg{flex:1}
.gq{display:flex;flex-direction:column;align-items:center;min-width:90px;text-align:center;gap:2px}.gq b{font-size:2.6rem;line-height:1;font-weight:800}.gq span{font-weight:700;font-size:.95rem}.gq small{color:var(--mut);font-size:.75rem}
@media print{#sum{font-size:inherit}.ohd b{font-size:16px}.ohd{border-color:#000}.gt b{font-size:19px}.gkv div{font-size:13px}.grp{border:1px solid #999;break-inside:auto}.ghd{border-color:#000;break-after:avoid}.gc{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.gq b{font-size:32px}.draw.gd{break-inside:avoid}}

.sheet{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);margin:12px auto 0;max-width:680px}.sheet svg{display:block;width:100%;height:auto}#sum:empty{display:none}
@media print{#pt thead{display:none!important}#sumdraw .sheet{border:0;box-shadow:none;margin:0 auto;width:190mm;max-width:none;break-after:page;page-break-after:always}#sumdraw .sheet:last-child{break-after:auto;page-break-after:auto}}

/* ===== Dream Light theme (matches the catalog) ===== */
:root{--bg:#f4f4f2;--card:#fff;--fg:#151513;--mut:#77766f;--line:#dcdcd7;--soft:#ecebe7;--acc:#151513;--accfg:#f4f4f2;--hi:#d9a253;--bar:#f4f4f2;--spectrum:linear-gradient(90deg,#d9a253,#e9c68c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121210;--card:#1b1b19;--fg:#efeee9;--mut:#9a998f;--line:#2e2e2a;--soft:#242421;--acc:#efeee9;--accfg:#121210;--bar:#121210}}
body::before{background:var(--bg)}
.appbar{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);border-bottom:1px solid var(--line)}
.appbar::after{display:none}
.appbar img{filter:invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .appbar img{filter:none}}
.appbar .ttl{border-inline-start-color:var(--line)}
.appbar .ttl b{font-weight:800}
.appbar .ttl span{color:var(--mut)}
.appbar .back{background:var(--fg);color:var(--bg);border-color:var(--fg);border-radius:999px}
.phero{margin:30px 0 22px}
.phero h1{font-weight:800;font-size:clamp(34px,7vw,72px);letter-spacing:-.03em;line-height:.95}
.steps span{border-radius:999px}
.steps i{color:var(--hi)}
.card{border-radius:8px}
#list .card::before{background:var(--fg);height:2px}
#add{background:var(--fg);color:var(--bg);text-shadow:none;border-radius:999px}
button{border-radius:999px}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sh{border-radius:8px}
.sh.on{border-color:var(--fg);outline-color:var(--fg)}
input:focus,select:focus,textarea:focus{outline-color:var(--hi)}
</style>

async function bkOpen(url){const k=bkKey();if(!k||!window.crypto||!crypto.subtle)return null;try{const r=await fetch(url,{cache:"no-store"});const e=await r.json();const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const kk=await crypto.subtle.importKey("raw",new Uint8Array(k.match(/../g).map(h=>parseInt(h,16))),"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(e.iv)},kk,b(e.ct));return JSON.parse(new TextDecoder().decode(pt))}
 catch(err){if(err&&err.name==="OperationError"){try{localStorage.removeItem(BK_KEY)}catch(_){}BK_K=null}return null}}
